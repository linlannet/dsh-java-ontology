# 权限矩阵 — 活文档
# P2-19 自动生成，由 PermissionMatrixTest 验证
# 更新日期：2026-10-18
#
# 角色层级：
#   0 = director（主任）
#   1 = researcher（研究员）
#   2 = guest（访客）
#
# required_role 含义：
#   public  — @PublicApi，无需认证
#   0       — 仅主任
#   1       — 主任 + 研究员
#   2       — 主任 + 研究员 + 访客
#   fail-closed（无注解）— 默认拒绝，测试会报违规

endpoints:

  # === 认证 ===
  - { method: POST,   path: /api/auth/login,            required_role: public, controller: AuthController }
  - { method: POST,   path: /api/auth/register,         required_role: public, controller: AuthController }
  - { method: GET,    path: /api/auth/userinfo,         required_role: 2,      controller: AuthController }
  - { method: PUT,    path: /api/auth/password,         required_role: 2,      controller: AuthController }

