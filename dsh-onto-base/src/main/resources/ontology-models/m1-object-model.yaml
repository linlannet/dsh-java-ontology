  - id: AGG-ONT-VERSION-001
    name: 本体版本
    alias: OntologyVersion
    aggregateType: AGGREGATE_ROOT
    description: 本体知识库版本记录，支持多版本管理
    lifecycle: [草稿, 发布, 归档]
    tags: [本体域, 共享层]
    attributes:
      - { name: id, label: 主键, type: Long, required: true, unique: true }
      - { name: versionCode, label: 版本号, type: String, required: true }
      - { name: versionName, label: 版本名称, type: String, required: false }
      - { name: entityCount, label: 实体数量, type: Integer, defaultValue: "0" }
      - { name: source, label: 数据来源, type: String, required: false }
      - { name: status, label: 状态, type: Enum, enumValues: [0_草稿, 1_发布, 2_归档], defaultValue: "0" }

  - id: AGG-ONT-ENTITY-001
    name: 本体实体
    alias: OntologyEntity
    aggregateType: AGGREGATE_ROOT
