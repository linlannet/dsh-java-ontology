# M1 对象模型元文件（产品层 base）- m1-object-model.yaml
# 通用本体平台框架：版本/实体/多语种/事件类型/地名/术语 + 动态属性/通用关系
# 多业务方向支持：siis / factory / ecommerce / city-ops（通过 domain 字段隔离）
model_type: OBJECT
version: "3.0"
domain: "通用本体知识库平台"

aggregates:
  - id: AGG-SYS-USER-001
    name: 系统用户
    alias: SysUser
    aggregateType: AGGREGATE_ROOT
    description: 平台用户，含主任/研究员/访客三种角色层级
    lifecycle: [正常, 停用]
    tags: [系统域, 共享层]
    attributes:
      - { name: userId, label: 用户ID, type: Long, required: true, unique: true }
      - { name: tenantId, label: 租户ID, type: Long, required: false, description: "主任可为NULL" }
      - { name: roleLevel, label: 角色层级, type: Enum, enumValues: [0_主任, 1_研究员, 2_访客], required: true, defaultValue: "2" }
      - { name: userName, label: 用户名, type: String, required: true, unique: true }
      - { name: nickName, label: 昵称, type: String, required: false }
      - { name: email, label: 邮箱, type: String, required: false }
      - { name: phonenumber, label: 手机号, type: String, required: false }
      - { name: password, label: 密码, type: String, required: true, description: "加密存储" }
      - { name: status, label: 状态, type: Enum, enumValues: [0_正常, 1_停用], required: true, defaultValue: "0" }
      - { name: loginIp, label: 最后登录IP, type: String, required: false }
      - { name: loginDate, label: 最后登录时间, type: DateTime, required: false }

