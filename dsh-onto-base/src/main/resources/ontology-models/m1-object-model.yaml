      - { name: id, label: 主键, type: Long, required: true, unique: true }
      - { name: entityId, label: 关联实体ID, type: Long, required: true }
      - { name: attrName, label: 属性名, type: String, required: true, description: "如 rated_power / price / lifespan" }
      - { name: attrValue, label: 属性值, type: Text, required: false }
      - { name: attrType, label: 属性类型, type: Enum, enumValues: [STRING, NUMBER, DATE, JSON, BOOLEAN], defaultValue: "STRING" }
