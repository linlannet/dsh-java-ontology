# M2 行为模型元文件（产品层 base）- m2-behavior-model.yaml
# 通用本体 CRUD + 沉淀/汇聚行为（与业务方向无关）
model_type: BEHAVIOR
version: "3.0"
domain: "通用本体知识库平台"

behaviors:
  - id: Ontology_Create
    name: 创建本体实体
    ownerEntity: AGG-ONT-ENTITY-001
    behaviorType: COMMAND
    triggerType: USER_ACTION
    preconditions: ["用户具备本体维护权限"]
    postconditions: []
    appliedRules: [RULE-ONT-NAME-NOT-EMPTY]
    requiredPermissions: [PERM-ONT-CREATE]
    syncTriggers: []

  - id: Ontology_Update
    name: 更新本体实体
    ownerEntity: AGG-ONT-ENTITY-001
    behaviorType: COMMAND
    triggerType: USER_ACTION
    preconditions: ["实体存在且未删除"]
    postconditions: []
    appliedRules: []
    requiredPermissions: [PERM-ONT-UPDATE]
    syncTriggers: []

  - id: Ontology_Delete
    name: 删除本体实体（逻辑删除）
    ownerEntity: AGG-ONT-ENTITY-001
    behaviorType: COMMAND
    triggerType: USER_ACTION
    preconditions: ["实体存在", "无个人层引用"]
    postconditions:
      - field: entity.delFlag
        setValue: "1"
    appliedRules: []
    requiredPermissions: [PERM-ONT-DELETE]
    syncTriggers: []

  - id: Ontology_Promote
    name: 晋升发现实体到本体
    ownerEntity: AGG-ONT-ENTITY-001
    behaviorType: COMMAND
    triggerType: USER_ACTION
    preconditions: ["发现实体状态为 DISCOVERED", "实体名称非空"]
    postconditions:
      - field: discoveredEntity.status
        setValue: "PROMOTED"
      - field: discoveredEntity.ontologyEntityId
        setValue: "新建本体实体ID"
    appliedRules: [RULE-PROMOTE-ELIGIBLE]
    requiredPermissions: [PERM-ONT-CREATE]
    syncTriggers:
      - behaviorRef: Global_Aggregate_Entity
        description: 晋升后触发全局汇聚更新

  # ══════════════════════════════════════════════════════════
  # 二、监测域行为（个人层，研究员操作）
  # ══════════════════════════════════════════════════════════
      - field: task.status
        setValue: "running"
    appliedRules: [RULE-CRAWL-RATE-LIMIT]
    requiredPermissions: []
    syncTriggers:
      - behaviorRef: Article_Save
        description: 采集到文章后保存
      - behaviorRef: CrawlTask_Complete
        description: 采集完成后更新任务状态

      - field: task.status
        setValue: "success / failed"
    appliedRules: []
    requiredPermissions: []
    syncTriggers: []

      - field: article.nlpStatus
        setValue: "PENDING"
    appliedRules: [RULE-ARTICLE-DEDUP]
    requiredPermissions: []
    syncTriggers:
      - behaviorRef: Nlp_Process
        description: 文章保存后触发NLP处理

      - behaviorRef: Kg_Build_Log
        description: 记录构建日志

      - field: article.nlpStatus
        setValue: "COMPLETED"
    appliedRules: [RULE-NLP-MODEL-DEPLOYED]
    requiredPermissions: []
    syncTriggers:
      - behaviorRef: Alert_Check
        description: NLP完成后检查告警规则

      - behaviorRef: Alert_Record_Create
        description: 规则匹配时创建告警记录

      - field: alertRecord.status
        setValue: "unread"
    appliedRules: []
    requiredPermissions: []
    syncTriggers:
      - behaviorRef: Push_Send
        description: 告警创建后触发推送

  # ══════════════════════════════════════════════════════════
  # 四、展示域行为（个人层，报告 + 推送 + 推荐）
  # ══════════════════════════════════════════════════════════
      - field: report.status
        setValue: "draft"
    appliedRules: []
    requiredPermissions: [PERM-DISPLAY-REPORT]
    syncTriggers: []

      - field: report.status
        setValue: "published"
      - field: report.publishTime
        setValue: "当前时间"
    appliedRules: []
    requiredPermissions: [PERM-DISPLAY-REPORT]
    syncTriggers: []

      - field: pushRecord.status
        setValue: "success / failed"
    appliedRules: []
    requiredPermissions: []
    syncTriggers: []

  - id: DiscoveredEntity_Record
    name: 记录发现实体
    ownerEntity: AGG-CMN-DISCOVERED-ENTITY-001
    behaviorType: COMMAND
    triggerType: SYSTEM
    preconditions: ["实体名称非空"]
    postconditions: []
    appliedRules: [RULE-DISCOVERED-DEDUP]
    requiredPermissions: []
    syncTriggers:
      - behaviorRef: Global_Aggregate_Entity
        description: 发现实体后触发全局汇聚

  - id: VectorIndex_Update
    name: 更新向量索引
    ownerEntity: AGG-CMN-VECTOR-INDEX-001
    behaviorType: COMMAND
    triggerType: SYSTEM
    preconditions: ["实体存在"]
    postconditions: []
    appliedRules: []
    requiredPermissions: []
    syncTriggers: []

  # ══════════════════════════════════════════════════════════
  # 六、全局汇聚域行为（共享层，主任触发）
  # ══════════════════════════════════════════════════════════
  - id: Global_Aggregate
    name: 执行全局汇聚
    ownerEntity: AGG-GLB-AGG-LOG-001
    behaviorType: COMMAND
    triggerType: SCHEDULED
    preconditions: ["用户为主任角色"]
    postconditions: []
    appliedRules: []
    requiredPermissions: [PERM-GLOBAL-AGGREGATE]
    syncTriggers:
      - behaviorRef: Global_Aggregate_Entity
        description: 汇聚发现实体
      - behaviorRef: Global_Aggregate_Relation
        description: 汇聚双边关系
      - behaviorRef: Global_Aggregate_KG
        description: 汇聚知识图谱

  - id: Global_Aggregate_Entity
    name: 汇聚全局发现实体
    ownerEntity: AGG-GLB-DISCOVERED-ENTITY-001
    behaviorType: COMMAND
    triggerType: SYSTEM
    preconditions: []
    postconditions: []
    appliedRules: [RULE-AGGREGATE-DEDUP]
    requiredPermissions: []
    syncTriggers: []

  - id: Global_Aggregate_Relation
    name: 汇聚全局双边关系
    ownerEntity: AGG-GLB-BILATERAL-001
    behaviorType: COMMAND
    triggerType: SYSTEM
    preconditions: []
    postconditions: []
    appliedRules: [RULE-AGGREGATE-DEDUP]
    requiredPermissions: []
    syncTriggers: []

  - id: Global_Aggregate_KG
    name: 汇聚全局知识图谱
    ownerEntity: AGG-GLB-KG-NODE-001
    behaviorType: COMMAND
    triggerType: SYSTEM
    preconditions: []
    postconditions: []
    appliedRules: [RULE-AGGREGATE-DEDUP]
    requiredPermissions: []
    syncTriggers: []

  # ══════════════════════════════════════════════════════════
  # 七、通用 CRUD（各域通用查询行为）
  # ══════════════════════════════════════════════════════════
